<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="Les repères de volume : sous 10 séries on entretient, de 12 à 18 on progresse, au-delà de 25 on ne récupère plus">
  <title>Combien de séries par semaine</title>
  <style>
    .t   { font-family: "Segoe UI", Arial, sans-serif; fill: #F8F9FA; }
    .ttl { font-size: 15px; font-weight: 700; letter-spacing: .4px; }
    .sub { font-size: 11.5px; fill: #9CA3AF; }
    .zon { font-size: 13px; font-weight: 700; }
    .dsc { font-size: 11.5px; fill: #C7CCD3; }
    .num { font-size: 11px; fill: #9CA3AF; }
  </style>

  <rect width="760" height="250" fill="#131A24"/>

  <text class="t ttl" x="24" y="32">Combien de séries par semaine, et par mouvement</text>
  <text class="t sub" x="24" y="52">Des repères de population, pas une règle individuelle.</text>

  <!-- barre continue -->
  <g>
    <rect x="24"  y="78" width="176" height="46" rx="4" fill="#22313F" stroke="#2F4256"/>
    <rect x="204" y="78" width="264" height="46" rx="4" fill="#1E3A28" stroke="#2F7A47"/>
    <rect x="472" y="78" width="160" height="46" rx="4" fill="#3A2C18" stroke="#7A5A22"/>
    <rect x="636" y="78" width="100" height="46" rx="4" fill="#3A1E1E" stroke="#7A2F2F"/>
  </g>

  <!-- reperes chiffres -->
  <g class="t num" text-anchor="middle">
    <text x="204" y="142">10</text>
    <text x="468" y="142">18</text>
    <text x="636" y="142">25</text>
  </g>
  <g stroke="#4B5563" stroke-width="1">
    <line x1="204" y1="124" x2="204" y2="132"/>
    <line x1="468" y1="124" x2="468" y2="132"/>
    <line x1="636" y1="124" x2="636" y2="132"/>
  </g>

  <!-- libelles -->
  <text class="t zon" x="36"  y="106" fill="#7FA6C9">Entretien</text>
  <text class="t zon" x="216" y="106" fill="#5FBF7A">Progression</text>
  <text class="t zon" x="484" y="106" fill="#D9A441">Volume élevé</text>
  <text class="t zon" x="648" y="106" fill="#E86A5A">Trop</text>

  <!-- descriptions -->
  <text class="t dsc" x="24"  y="176">Sous 10 séries, tu gardes</text>
  <text class="t dsc" x="24"  y="192">ce que tu as sans construire.</text>

  <text class="t dsc" x="204" y="176">De 12 à 18 séries : la zone où</text>
  <text class="t dsc" x="204" y="192">le cycle te place.</text>

  <text class="t dsc" x="472" y="176">Possible, mais la récupération</text>
  <text class="t dsc" x="472" y="192">devient le facteur limitant.</text>

  <text class="t dsc" x="636" y="176">Au-delà de ce que la</text>
  <text class="t dsc" x="636" y="192">plupart récupèrent.</text>

  <text class="t sub" x="24" y="228">Le soulevé de terre coûte plus cher : sa fourchette utile est plutôt de 8 à 12 séries.</text>
</svg>
