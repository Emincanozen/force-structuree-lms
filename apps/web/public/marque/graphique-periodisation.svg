<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Le cycle de 12 semaines en trois blocs : l'intensité monte pendant que le volume descend">
  <title>Le cycle de 12 semaines</title>
  <style>
    .t  { font-family: "Segoe UI", Arial, sans-serif; fill: #F8F9FA; }
    .lbl{ font-size: 13px; font-weight: 600; }
    .sub{ font-size: 11.5px; fill: #9CA3AF; }
    .num{ font-size: 12px; fill: #C7CCD3; }
    .ttl{ font-size: 15px; font-weight: 700; letter-spacing: .4px; }
    .ax { stroke: #374151; stroke-width: 1; }
  </style>

  <rect width="760" height="330" fill="#131A24"/>

  <text class="t ttl" x="24" y="32">Le cycle de 12 semaines</text>
  <text class="t sub" x="24" y="52">L'intensité monte pendant que le volume descend. Les deux ne montent jamais ensemble.</text>

  <!-- axes -->
  <line class="ax" x1="60" y1="240" x2="720" y2="240"/>

  <!-- blocs -->
  <g>
    <rect x="60"  y="96"  width="210" height="144" rx="4" fill="#1F2A37" stroke="#374151"/>
    <rect x="280" y="96"  width="260" height="144" rx="4" fill="#1F2A37" stroke="#374151"/>
    <rect x="550" y="96"  width="170" height="144" rx="4" fill="#1F2A37" stroke="#374151"/>
  </g>

  <!-- volume : barres qui diminuent -->
  <g fill="#3E5573">
    <rect x="76"  y="128" width="42" height="112" rx="3"/>
    <rect x="126" y="132" width="42" height="108" rx="3"/>
    <rect x="176" y="136" width="42" height="104" rx="3"/>
    <rect x="226" y="196" width="30" height="44"  rx="3"/>

    <rect x="296" y="158" width="42" height="82" rx="3"/>
    <rect x="346" y="162" width="42" height="78" rx="3"/>
    <rect x="396" y="170" width="42" height="70" rx="3"/>
    <rect x="446" y="178" width="42" height="62" rx="3"/>
    <rect x="496" y="206" width="30" height="34" rx="3"/>

    <rect x="566" y="196" width="42" height="44" rx="3"/>
    <rect x="616" y="206" width="42" height="34" rx="3"/>
    <rect x="666" y="214" width="42" height="26" rx="3"/>
  </g>

  <!-- intensite : ligne qui monte -->
  <polyline points="97,206 147,196 197,190 241,216 317,180 367,174 417,166 467,156 511,208 587,134 637,124 687,116"
            fill="none" stroke="#E8590C" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#E8590C">
    <circle cx="97" cy="206" r="3.5"/><circle cx="147" cy="196" r="3.5"/>
    <circle cx="197" cy="190" r="3.5"/><circle cx="241" cy="216" r="3.5"/>
    <circle cx="317" cy="180" r="3.5"/><circle cx="367" cy="174" r="3.5"/>
    <circle cx="417" cy="166" r="3.5"/><circle cx="467" cy="156" r="3.5"/>
    <circle cx="511" cy="208" r="3.5"/><circle cx="587" cy="134" r="3.5"/>
    <circle cx="637" cy="124" r="3.5"/><circle cx="687" cy="116" r="3.5"/>
  </g>

  <!-- titres de blocs -->
  <text class="t lbl" x="76"  y="86">Bloc 1 · Accumulation</text>
  <text class="t sub" x="76"  y="115">70 à 80 % · 14 à 20 séries</text>
  <text class="t lbl" x="296" y="86">Bloc 2 · Intensification</text>
  <text class="t sub" x="296" y="115">80 à 90 % · 12 à 15 séries</text>
  <text class="t lbl" x="566" y="86">Bloc 3 · Réalisation</text>
  <text class="t sub" x="566" y="115">90 à 100 % · 6 à 10 séries</text>

  <!-- semaines -->
  <g class="t num" text-anchor="middle">
    <text x="97" y="260">S1</text><text x="147" y="260">S2</text>
    <text x="197" y="260">S3</text><text x="241" y="260">S4</text>
    <text x="317" y="260">S5</text><text x="367" y="260">S6</text>
    <text x="417" y="260">S7</text><text x="467" y="260">S8</text>
    <text x="511" y="260">S9</text><text x="587" y="260">S10</text>
    <text x="637" y="260">S11</text><text x="687" y="260">S12</text>
  </g>
  <text class="t sub" x="241" y="278" text-anchor="middle">deload</text>
  <text class="t sub" x="511" y="278" text-anchor="middle">deload</text>
  <text class="t sub" x="687" y="278" text-anchor="middle">test</text>

  <!-- legende -->
  <g transform="translate(60,302)">
    <rect x="0" y="-9" width="14" height="12" rx="2" fill="#3E5573"/>
    <text class="t sub" x="22" y="1">Volume, en séries par semaine</text>
    <line x1="230" y1="-3" x2="256" y2="-3" stroke="#E8590C" stroke-width="3" stroke-linecap="round"/>
    <text class="t sub" x="264" y="1">Intensité, en % du maximum</text>
  </g>
</svg>
